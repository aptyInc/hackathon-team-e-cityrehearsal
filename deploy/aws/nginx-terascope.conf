# Terascope AI demo: nginx on :80 in front of uvicorn on 127.0.0.1:8000.
# - long runs: proxy_read_timeout 600 (a fresh corridor run takes 1-2 minutes)
# - WebSocket upgrade for /stream/<run_id> (vehicle frames)
# - the frontend is served by the API from frontend/ with "http://localhost:8000" as its API address; the
#   sub_filter below rewrites that to this server's own address in HTML and JS, so nothing in frontend/ changes.
#   (upstream gzip is switched off for that; nginx compresses instead)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/geo+json;
    gzip_min_length 2000;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60;
        proxy_send_timeout 600;
        proxy_read_timeout 600;

        proxy_set_header Accept-Encoding "";
        sub_filter 'http://localhost:8000' '$scheme://$host';
        sub_filter_once off;
        sub_filter_types text/javascript application/javascript;     # text/html is always included
    }
}
